[project]
name = "py-st-vintage-goods-langgraph"
version = "0.1.0"
description = "A pre-owned goods inventory, purchase, resale and profit tracking system."
authors = [{ name = "Shawn Yu" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "access-modifiers>=0.3.1",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fake-useragent>=2.2.0",
    "fastapi>=0.163.2",
    "greenlet>=3.5.6",
    "pandas>=3.1.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "watchdog>=7.1.0",
]

[dependency-groups]
dev = [
    "git-changelog>=2.11.0",
    "ruff>=0.17.5",
]

[tool.git-changelog]
bump = "auto"
convention = "conventional"
in-place = false
filter-commits = ""
marker-line = "<!-- insertion marker for GitHub -->"
output = "CHANGELOG.md"
parse-refs = true
parse-trailers = true
provider = "github"
repository = "."
sections = ["feat", "fix", "chore", "docs", "perf", "build", "refactor", "test", "deps"]
template = "angular"
version-regex = "^## \\[(?P<version>v?[^\\]]+)"
versioning = "semver"
zerover = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["D203", "D213", "E501", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["py_ml_basic"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
